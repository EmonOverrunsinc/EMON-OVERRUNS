# Builds the Windows Setup program (apps/windows) and keeps the .exe as a download on the run:
# Actions › Windows app › the newest run › Artifacts (sign in to GitHub to download it).
name: Windows app

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows Setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build the Setup program
        working-directory: apps/windows
        run: |
          npm ci --no-audit --no-fund
          bash build.sh

      # the .exe itself (not zipped): the download is named after the file
      - uses: actions/upload-artifact@v7
        with:
          path: apps/windows/dist/EMON-OVERRUNS-E-Portal-Setup-*.exe
          archive: false
          if-no-files-found: error
          retention-days: 90
