# Temporary (one run, on this branch only): builds the Android app like android-app.yml and adds the unsigned APK
# and App Bundle to this branch in android-out/, because the run's Artifacts cannot be downloaded from the Claude session.
name: Android app hand-off

on:
  push:
    branches: [android-build-1.5]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the unsigned release APK and App Bundle
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Add the build to this branch (android-out/)
        run: |
          set -euo pipefail
          mkdir -p android-out
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             apps/android/app/build/outputs/bundle/release/app-release.aab apps/android/build.log android-out/
          (cd android-out && sha256sum app-release-unsigned.apk app-release.aab | tee SHA256SUMS)
          git add -f android-out
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Android build of $GITHUB_SHA"
          git push -q origin HEAD:refs/heads/android-build-1.5
