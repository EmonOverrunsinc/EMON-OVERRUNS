# Builds the Android app (apps/android) as an unsigned APK and keeps it, with the build log, as a download on
# the run (Actions › Android app › the newest run › Artifacts). The release key is kept by EMON OVERRUNS, not in
# this public repository: the APK is signed after download (see apps/README.md).
name: Android app

on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the unsigned release APK
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: E-Portal-Android-unsigned
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/build.log
          retention-days: 90
